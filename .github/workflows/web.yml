# Builds the browser/phone version with pygbag and publishes it to GitHub Pages
# on every push to main. One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Build web version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pygbag
        run: pip install pygbag
      - name: Leave out PC-only stuff (art sources, tools, previews) so the download is small
        run: |
          cp web/smashnet.js web/fit.js web/fit.css /tmp/
          rm -rf art_src old tools web preview_*.png *.bat
      - name: Build web version
        run: python -m pygbag --build --title "Chiikawa Smash" .
      - name: Fit the 1280x720 game to any phone screen + background colour
        run: |
          python - <<'PYEOF'
          p = "build/web/index.html"
          html = open(p, encoding="utf-8").read()
          import re
          # our own viewport rules (no zoom) replace pygbag's
          html = re.sub(r"<meta[^>]*name=[\"']viewport[\"'][^>]*>", "", html)
          style = ("<meta name='viewport' content='width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover'>"
                   "<meta name='mobile-web-app-capable' content='yes'><meta name='apple-mobile-web-app-capable' content='yes'>"
                   "<style>" + open("/tmp/fit.css", encoding="utf-8").read() + "</style>")
          script = "<script>" + open("/tmp/fit.js", encoding="utf-8").read() + "</script>"
          # online play: PeerJS (WebRTC) + our small bridge that Python talks to
          online = ('<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>'
                    "<script>" + open("/tmp/smashnet.js", encoding="utf-8").read() + "</script>")
          html = html.replace("</head>", style + online + "</head>", 1).replace("</body>", script + "</body>", 1)
          open(p, "w", encoding="utf-8").write(html)
          print("patched:", "fitGame" in html, "SmashNet" in html)
          PYEOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
